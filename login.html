<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECIPE Mania - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-utensils fs-3 me-2"></i>
                <span class="fw-bold fs-4">RECIPE <br><small class="fw-normal fs-6">Mania</small></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Recipes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="submit.html">Submit Recipe</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">My Recipes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact us</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="login.html" class="btn btn-outline-dark rounded-0 px-4 active border-2">Login</a>
                    <a href="login.html" class="btn btn-dark rounded-0 px-4">Sign up</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="container py-5 my-5 d-flex justify-content-center align-items-center" style="min-height: 50vh;">
        <div class="card rounded-0 border" style="max-width: 450px; width: 100%;">
            <div class="card-body p-5">
                <h3 class="fw-bold text-center mb-4">Welcome Back</h3>
                
                <form action="#" method="POST" id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email address</label>
                        <input type="email" class="form-control rounded-0 p-2" id="email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium d-flex justify-content-between">
                            Password
                            <a href="#" class="text-decoration-none text-dark small">Forgot password?</a>
                        </label>
                        <input type="password" class="form-control rounded-0 p-2" id="password" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                    </div>
                    
                    <button type="submit" class="btn btn-dark rounded-0 w-100 py-2 mb-3">Login</button>
                    
                    <div class="text-center text-secondary mb-3">Or login with</div>
                    
                    <div class="d-flex gap-2 mb-4">
                        <button type="button" class="btn btn-outline-dark rounded-0 w-50"><i class="fab fa-google me-2"></i>Google</button>
                        <button type="button" class="btn btn-outline-dark rounded-0 w-50"><i class="fab fa-facebook-f me-2"></i>Facebook</button>
                    </div>
                    
                    <div class="text-center">
                        <span class="text-secondary">Don't have an account?</span> 
                        <a href="#" class="text-dark fw-bold text-decoration-none">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-light py-4 mt-auto border-top">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div class="text-secondary mb-3 mb-md-0">
                &copy; 2026 RECIPE Mania. All right reserved
            </div>
            <div class="d-flex gap-4 fs-5 text-dark">
                <a href="#" class="text-dark"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="text-dark"><i class="fab fa-instagram"></i></a>
                <a href="#" class="text-dark"><i class="fab fa-twitter"></i></a>
                <a href="#" class="text-dark"><i class="fab fa-pinterest-p"></i></a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
