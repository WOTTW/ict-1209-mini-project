<!DOCTYPE html>

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active border-bottom border-2 border-dark" href="search.html">Recipes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>

                <div class="d-flex align-items-center gap-2">

                    <a href="login.html" class="btn btn-dark rounded-0 px-4">Sign up</a>

        <h2 class="fw-bold mb-4">Search Recipes</h2>
        <div class="row align-items-center mb-3">
            <div class="col-lg-8">
                <input type="text" class="form-control rounded-0 p-2" placeholder="Search recipes by name, Ingredient, Or keyword.....">
            </div>
            <div class="col-lg-4 d-flex justify-content-lg-end align-items-center mt-3 mt-lg-0">
                <label class="me-2 text-nowrap">Sort by:</label>
                <select class="form-select rounded-0 w-auto">
                    <option>Newest</option>
                    <option>Oldest</option>
                    <option>Highest Rated</option>
                </select>
            </div>
        </div>
